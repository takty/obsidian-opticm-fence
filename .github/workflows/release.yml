name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - run: corepack enable
            - name: Build plugin
              run: |
                  yarn install --immutable
                  yarn build

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      dist/opticm-fence/main.js
                      dist/opticm-fence/manifest.json
                      dist/opticm-fence/styles.css

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    dist/opticm-fence/main.js dist/opticm-fence/manifest.json dist/opticm-fence/styles.css
